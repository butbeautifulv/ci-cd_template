# GitHub OSS env — mirror config/oss-tool-versions.yaml (copy into workflow env:)
# Used by profile oss-full and security-gates-oss workflows

REGISTRY_BACKEND: gitlab
ENABLE_REAL_LINTERS: "true"
SECURITY_POLICY: config/security-gate-policy.yaml

OSS_SEMGREP_IMAGE: returntocorp/semgrep:1.117.0
OSS_SYFT_VERSION: v1.20.0
OSS_HADOLINT_IMAGE: hadolint/hadolint:v2.12.0-alpine
OSS_TRIVY_VERSION: "0.63.0"
OSS_GITLEAKS_VERSION: "8.22.1"
OSS_CHECKOV_VERSION: "3.2.449"
OSS_RUFF_VERSION: "0.11.8"
OSS_ZAPROXY_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.0

ACTIONS_CHECKOUT: v4
ACTIONS_UPLOAD_SARIF: v3
ACTIONS_UPLOAD_ARTIFACT: v4
ACTIONS_LOGIN_GHCR: v3
ACTIONS_BUILD_PUSH: v6
COSIGN_INSTALLER_VERSION: v3.6.0
