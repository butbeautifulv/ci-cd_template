# Mirror CI service registry — resolve-mirror-service.sh parses without PyYAML.
#
# Triggers (prefer no hotfix git tags):
#   - API/web/trigger/schedule with CI vars SERVICE_NAME + SOURCE_REF
#     (fleet: make mirror-fleet / scripts/mirror-fleet-trigger.py)
#   - Schedule sync-sources: SHA-change pipelines only
#   - Release tags: <service_name>/vX.Y.Z  (hotfix* banned in workflow)
#
# Fields:
#   enabled: true|false — fleet/sync skip when false (default true if omitted)
#   tier: pilot|core|candidate|skip — filter for fleet waves (default core)
# Optional per-service:
#   openapi_path, api_base_url, deploy_*, readiness_path, service_port
#
# Wave-3 (2026-07): hwa, data_lake, user (pilots only; core candidates disabled)

services:
  hwa_service:
    project_id: "1637"
    repo_url: "https://gitlab.svo.aero/dpm/airport_digital_ecosystem/map_objects/hwa_service.git"
    source_ref_fallback: "0.0.4"
    enabled: true
    tier: pilot
    service_port: "8000"
    deploy_command: "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"
    deploy_workdir: "/app/code"
    readiness_path: "/v1/openapi.json"
    api_path_prefix: "/v1"
    deploy_env_file: "config/mirror-deploy/hwa_service.env"
    deploy_stubs: "http,mongo"
  data_lake_service:
    project_id: "979"
    repo_url: "https://gitlab.svo.aero/dpm/airport_digital_ecosystem/map_objects/data_lake_service.git"
    source_ref_fallback: "0.4.10"
    enabled: true
    tier: pilot
    service_port: "8000"
    openapi_path: "openapi.json"
    deploy_command: "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"
    deploy_workdir: "/app/code"
    readiness_path: "/api/gis/v1/data-lake/healthcheck"
    api_path_prefix: "/api/gis/v1/data-lake"
    deploy_env_file: "config/mirror-deploy/data_lake_service.env"
    deploy_stubs: "http,mongo"
  user_service:
    project_id: "961"
    repo_url: "https://gitlab.svo.aero/dpm/airport_digital_ecosystem/map_objects/user_service.git"
    source_ref_fallback: "0.4.4"
    enabled: true
    tier: pilot
    service_port: "8000"
    openapi_path: "openapi.json"
    deploy_command: "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"
    deploy_workdir: "/app/code"
    readiness_path: "/v1/openapi.json"
    api_path_prefix: "/v1"
    deploy_env_file: "config/mirror-deploy/user_service.env"
    deploy_stubs: "http,mongo"
  dynamic_layer_service:
    project_id: "873"
    repo_url: "https://gitlab.svo.aero/dpm/airport_digital_ecosystem/map_objects/dynamic_layer_service.git"
    source_ref_fallback: "0.5.1"
    enabled: false
    tier: candidate
    service_port: "8000"
  event_service:
    project_id: "1259"
    repo_url: "https://gitlab.svo.aero/dpm/airport_digital_ecosystem/map_objects/event_service.git"
    source_ref_fallback: "0.4.1"
    enabled: false
    tier: candidate
    service_port: "8000"
  defects:
    project_id: "1623"
    repo_url: "https://gitlab.svo.aero/dpm/airport_digital_ecosystem/map_objects/defects.git"
    source_ref_fallback: "0.5.7"
    enabled: false
    tier: candidate
    service_port: "8000"
