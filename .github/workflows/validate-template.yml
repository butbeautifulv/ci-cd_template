name: Validate Template

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'Makefile'
  pull_request:
    paths:
      - 'templates/**'
      - 'config/**'
      - 'scripts/**'
      - 'Makefile'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate templates
        run: make validate-quick
      - name: Validate Helm chart baseline
        run: make validate-helm
      - name: Validate OSS and registry
        run: |
          bash scripts/validate-github-oss.sh
          bash scripts/validate-gitlab-oss.sh
          bash scripts/validate-oss-pins.sh
          bash scripts/validate-registry-config.sh
      - name: Gate-check self-test
        run: |
          echo '{"runs":[{"results":[{"level":"error","message":{"text":"test"}}]}]}' > /tmp/test.sarif
          python3 scripts/gate-check.py --control sast --report /tmp/test.sarif || true
