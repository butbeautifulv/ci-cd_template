[project]
name = "fabrica-diagrams"
version = "0.1.0"
description = "Threat modeling and architecture diagrams for Fabrica (DFD, C4, pipeline overlay)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
fabrica-diagrams = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diagrams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
