name: Base Validate

on:
  workflow_call:
    inputs:
      enable_real_linters:
        description: Run Ruff when true
        required: false
        type: string
        default: "false"
      ruff_version:
        description: Pinned Ruff version for oss-full
        required: false
        type: string
        default: "0.11.8"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('uv.lock') != ''
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint (uv)
        if: hashFiles('uv.lock') != ''
        run: |
          if [ "${{ inputs.enable_real_linters }}" = "true" ]; then
            uv sync
            uv run ruff check . || true
          else
            echo "Placeholder lint — set enable_real_linters=true"
          fi
      - name: Lint (pip)
        if: hashFiles('uv.lock') == ''
        run: |
          if [ "${{ inputs.enable_real_linters }}" = "true" ]; then
            pip install -q "ruff==${{ inputs.ruff_version }}"
            ruff check . || true
          else
            echo "Placeholder lint — set enable_real_linters=true"
          fi

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('uv.lock') != ''
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests (uv)
        if: hashFiles('uv.lock') != ''
        run: |
          if [ -d tests ]; then
            uv sync
            uv run pytest tests/ -q || true
          else
            echo "Placeholder unit tests — add tests/"
          fi
      - name: Unit tests (pip)
        if: hashFiles('uv.lock') == ''
        run: |
          if [ -f requirements.txt ] && [ -d tests ]; then
            pip install -q pytest -r requirements.txt
            pytest tests/ -q || true
          else
            echo "Placeholder unit tests — add tests/ and requirements.txt"
          fi
