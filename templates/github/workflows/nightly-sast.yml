name: Nightly SAST

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_call:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.117.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep full scan
        run: semgrep scan --config auto --sarif -o semgrep.sarif .
      - name: Gate check
        if: always()
        run: |
          [ -s semgrep.sarif ] || { echo "::error::semgrep did not produce a non-empty semgrep.sarif — refusing to silently pass a SAST gate with no real report." >&2; exit 1; }
          python scripts/gate-check.py --control sast --report semgrep.sarif
