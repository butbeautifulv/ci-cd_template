name: IaC Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,helm,dockerfile
          soft_fail: true
          output_format: sarif
          output_file_path: reports/checkov.sarif
      - name: Gate check
        if: always()
        env:
          SECURITY_POLICY: ${{ env.SECURITY_POLICY }}
        run: |
          POLICY="${SECURITY_POLICY:-config/security-gate-policy.yaml}"
          python scripts/gate-check.py --control iac --report reports/checkov.sarif --policy "$POLICY"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/checkov.sarif
          category: iac
