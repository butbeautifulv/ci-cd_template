name: OSS Gitleaks

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="${OSS_GITLEAKS_VERSION:-8.22.1}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
      - name: Scan
        run: gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif --no-git || true
      - uses: ./.github/actions/gate-and-export
        if: always()
        with:
          control: secrets
          report: gitleaks.sarif
          category: secrets
