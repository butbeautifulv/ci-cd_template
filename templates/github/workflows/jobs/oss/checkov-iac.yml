name: OSS Checkov IaC

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install -q "checkov==${OSS_CHECKOV_VERSION:-3.2.449}"
      - name: Scan
        run: |
          mkdir -p reports
          checkov -d . --framework terraform,kubernetes,helm,dockerfile,docker_compose --soft-fail \
            --output sarif --output-file-path reports || true
          # checkov's output filename varies by version — normalize the path, but don't
          # fabricate a fake clean report if checkov produced neither: gate-and-export's
          # gate-check step treats a genuinely missing report as "tool didn't run", not "clean".
          [ -f reports/results_sarif.sarif ] && cp reports/results_sarif.sarif reports/checkov.sarif
          true
      - uses: ./.github/actions/gate-and-export
        if: always()
        with:
          control: iac
          report: reports/checkov.sarif
          category: iac
          tool_name: checkov
          defectdojo_url: ${{ vars.DEFECTDOJO_URL }}
          defectdojo_token: ${{ secrets.DEFECTDOJO_API_TOKEN }}
