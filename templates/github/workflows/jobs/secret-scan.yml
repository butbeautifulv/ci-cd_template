name: Secret Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action never leaves a report file in the workspace for a
      # later step to read — it only uploads a SARIF as a GitHub Actions artifact,
      # and only when it finds a leak. The old "Gate check" step below could never
      # see real findings; it always fell through to a fabricated empty report. It's
      # also a commercial product requiring GITLEAKS_LICENSE for org-owned repos, and
      # v2 (Node 20) is past GitHub's default-runtime cutover. Run the OSS CLI in a
      # pinned container instead — same tool, a real gitleaks.sarif on disk, no license.
      - name: Scan
        run: |
          IMAGE="${OSS_GITLEAKS_IMAGE:-ghcr.io/gitleaks/gitleaks:v8.22.1}"
          docker run --rm -v "$PWD:/repo" -w /repo "$IMAGE" \
            detect --source . --report-format sarif --report-path gitleaks.sarif --no-git || true
          sudo chown "$(id -u):$(id -g)" gitleaks.sarif 2>/dev/null || true
      - name: Gate check
        if: always()
        env:
          SECURITY_POLICY: ${{ env.SECURITY_POLICY }}
        run: |
          POLICY="${SECURITY_POLICY:-config/security-gate-policy.yaml}"
          python scripts/gate-check.py --control secrets --report gitleaks.sarif --policy "$POLICY"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: secrets
