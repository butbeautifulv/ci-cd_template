name: SAST

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Multiple languages analyzed in one job would collide on a single
        # upload-sarif category (GitHub stopped merging multi-run uploads
        # under one category on 2025-07-21) and, worse, only the language
        # whose result file the gate check happened to look at would ever
        # actually be gated. A matrix gives each language its own category
        # and its own gate check — this is also GitHub's own recommended
        # pattern for multi-language CodeQL.
        language: [javascript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-sarif
      - name: Gate check CodeQL
        if: always()
        env:
          SECURITY_POLICY: ${{ env.SECURITY_POLICY }}
        run: |
          REPORT="codeql-sarif/${{ matrix.language }}.sarif"
          [ -f "$REPORT" ] || { echo "::error::CodeQL did not produce $REPORT — check the analyze step above; refusing to silently pass a SAST gate with no real report." >&2; exit 1; }
          POLICY="${SECURITY_POLICY:-config/security-gate-policy.yaml}"
          python scripts/gate-check.py --control sast --report "$REPORT" --policy "$POLICY"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.117.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: semgrep scan --config p/ci --sarif -o semgrep.sarif .
      - name: Gate check
        if: always()
        env:
          SECURITY_POLICY: ${{ env.SECURITY_POLICY }}
        run: |
          [ -s semgrep.sarif ] || { echo "::error::semgrep did not produce a non-empty semgrep.sarif — refusing to silently pass a SAST gate with no real report." >&2; exit 1; }
          POLICY="${SECURITY_POLICY:-config/security-gate-policy.yaml}"
          python scripts/gate-check.py --control sast --report semgrep.sarif --policy "$POLICY"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: sast-semgrep
