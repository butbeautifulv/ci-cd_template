name: Security Linters

on:
  workflow_call:

jobs:
  linter-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('uv.lock') != ''
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        if: hashFiles('uv.lock') == ''
        with:
          python-version: "3.13"
      - name: Ruff security lint (uv)
        if: hashFiles('uv.lock') != ''
        run: |
          if [ "${ENABLE_REAL_LINTERS:-false}" = "true" ]; then
            uv sync
            uv run ruff check . --output-format sarif -o linter.sarif || true
          else
            echo '{"runs":[{"results":[]}]}' > linter.sarif
          fi
      - name: Ruff security lint (pip)
        if: hashFiles('uv.lock') == ''
        run: |
          if [ "${ENABLE_REAL_LINTERS:-false}" = "true" ]; then
            pip install ruff
            ruff check . --output-format sarif -o linter.sarif || true
          else
            echo "Linter stub — set ENABLE_REAL_LINTERS=true"
            echo '{"runs":[{"results":[]}]}' > linter.sarif
          fi
      - name: Gate check
        env:
          SECURITY_POLICY: ${{ env.SECURITY_POLICY }}
        run: |
          POLICY="${SECURITY_POLICY:-config/security-gate-policy.yaml}"
          python scripts/gate-check.py --control linters --report linter.sarif --policy "$POLICY"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: linter.sarif
          category: linters
