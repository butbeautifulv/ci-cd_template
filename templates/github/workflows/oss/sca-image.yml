name: OSS SCA Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  trivy-sca:
    runs-on: ubuntu-latest
    if: inputs.image != 'none' && inputs.image != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          TRIVY_VERSION="${OSS_TRIVY_VERSION:-0.63.0}"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C /usr/local/bin trivy
      - name: Registry auth for private image
        env:
          REGISTRY_BACKEND: ${{ vars.REGISTRY_BACKEND || 'gitlab' }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/registry-resolve-env.sh
          source scripts/registry-auth-env.sh
          echo "TRIVY_USERNAME=$TRIVY_USERNAME" >> "$GITHUB_ENV"
          echo "TRIVY_PASSWORD=$TRIVY_PASSWORD" >> "$GITHUB_ENV"
      - name: Scan image
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH --format sarif \
            --output sca.sarif "${{ inputs.image }}" || true
      - name: Gate check
        if: always()
        run: |
          [ -f sca.sarif ] || echo '{"runs":[{"results":[]}]}' > sca.sarif
          python scripts/gate-check.py --control sca --report sca.sarif
      - name: ASPM export
        if: always() && vars.DEFECTDOJO_URL != ''
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
        run: python scripts/aspm-export.py --control sca --report sca.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sca.sarif
          category: sca

  skip:
    runs-on: ubuntu-latest
    if: inputs.image == 'none' || inputs.image == ''
    steps:
      - run: echo "No image to scan — skip SCA"
