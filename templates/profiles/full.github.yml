# GitHub profile: full — see templates/github/workflows/ci.yml

name: CI Full

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "lint stub"

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "test stub"

  security-gates:
    needs: [lint, unit-test]
    uses: ./.github/workflows/security-gates.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [security-gates]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - run: echo "docker build -t ${{ env.REGISTRY }}:${{ github.sha }} ."

  sbom:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/sbom.yml

  container-scan:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/container-scan.yml
    with:
      image: ${{ env.REGISTRY }}:${{ github.sha }}

  sign:
    if: github.ref == 'refs/heads/main'
    needs: [container-scan]
    uses: ./.github/workflows/jobs/sign.yml

  deploy-preprod:
    if: github.ref == 'refs/heads/main'
    needs: [sign]
    uses: ./.github/workflows/deploy-preprod.yml

  dast:
    if: github.ref == 'refs/heads/main'
    needs: [deploy-preprod]
    uses: ./.github/workflows/dast.yml

  sec-func-tests:
    if: github.ref == 'refs/heads/main'
    needs: [deploy-preprod]
    uses: ./.github/workflows/jobs/sec-func-tests.yml

  iast-preprod:
    if: github.ref == 'refs/heads/main'
    needs: [deploy-preprod]
    uses: ./.github/workflows/jobs/iast-preprod.yml
