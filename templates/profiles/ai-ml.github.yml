# GitHub profile: ai-ml — shift-left + AI/ML optional jobs

name: CI AI ML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  ENABLE_REAL_LINTERS: "false"

jobs:
  validate:
    uses: ./.github/workflows/base-validate.yml
    secrets: inherit
    with:
      enable_real_linters: "false"

  security-gates:
    needs: [validate]
    uses: ./.github/workflows/security-gates.yml
    secrets: inherit
    with:
      security_policy: config/security-gate-policy-adopt.yaml
      sast_job: sast-python
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  skill-scanner:
    needs: [security-gates]
    uses: ./.github/workflows/jobs/skill-scanner.yml
    secrets: inherit

  mcp-scan:
    needs: [security-gates]
    uses: ./.github/workflows/jobs/mcp-scan.yml
    secrets: inherit

  ml-data-scan:
    needs: [security-gates]
    uses: ./.github/workflows/jobs/ml-data-scan.yml
    secrets: inherit

  pickle-scan:
    needs: [security-gates]
    uses: ./.github/workflows/jobs/pickle-scan.yml
    secrets: inherit

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [security-gates]
    steps:
      - uses: actions/checkout@v4
      - run: echo "build stub"

  aibom:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/aibom.yml
    secrets: inherit

  ml-bom:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/ml-bom.yml
    secrets: inherit

  ml-model-scan:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/ml-model-scan.yml
    secrets: inherit
