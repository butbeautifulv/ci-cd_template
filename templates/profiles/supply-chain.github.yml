# GitHub profile: supply-chain — shift-left + SBOM + container scan

name: CI Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  ENABLE_REAL_LINTERS: "false"

jobs:
  validate:
    uses: ./.github/workflows/base-validate.yml
    secrets: inherit
    with:
      enable_real_linters: "false"

  security-gates:
    needs: [validate]
    uses: ./.github/workflows/security-gates.yml
    secrets: inherit
    with:
      security_policy: config/security-gate-policy-adopt.yaml
      sast_job: sast-python
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [security-gates]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - run: echo "docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} ."

  sbom:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/sbom.yml
    secrets: inherit

  container-scan:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/container-scan.yml
    secrets: inherit
    with:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}

  sign:
    if: github.ref == 'refs/heads/main'
    needs: [container-scan]
    uses: ./.github/workflows/jobs/sign.yml
    secrets: inherit
