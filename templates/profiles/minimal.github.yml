# GitHub profile: minimal (A2)
# Copy relevant jobs to .github/workflows/ci.yml or use as reference

name: CI Minimal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  ENABLE_REAL_LINTERS: "false"

jobs:
  validate:
    uses: ./.github/workflows/base-validate.yml
    with:
      enable_real_linters: ${{ env.ENABLE_REAL_LINTERS }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f Dockerfile ]; then
            echo "docker build -t ${{ env.REGISTRY }}:${{ github.sha }} ."
          fi
