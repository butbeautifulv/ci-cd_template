# GitHub profile: oss-full — 100% OSS scanners + GHCR build/push
# No CodeQL / dependency-review — see security-gates-oss.yml

name: CI OSS Full

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  CI_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  REGISTRY_BACKEND: gitlab
  ENABLE_REAL_LINTERS: "true"
  SECURITY_POLICY: config/security-gate-policy.yaml
  OSS_SEMGREP_IMAGE: returntocorp/semgrep:1.117.0
  OSS_SYFT_VERSION: v1.20.0
  OSS_TRIVY_IMAGE: aquasec/trivy:0.63.0
  OSS_GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.22.1
  OSS_HADOLINT_IMAGE: hadolint/hadolint:v2.12.0-alpine
  OSS_CONFTEST_IMAGE: ghcr.io/openpolicyagent/conftest:v0.56.0
  OSS_ZAPROXY_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.0
  OSS_SCHEMATHESIS_IMAGE: ghcr.io/schemathesis/schemathesis:4.21.7
  OSS_AFLPP_IMAGE: aflplusplus/aflplusplus:v4.40c
  OSS_GOLANG_IMAGE: golang:1.23.8-bookworm
  OSS_MAVEN_IMAGE: maven:3.9.9-eclipse-temurin-17
  OSS_CHECKOV_VERSION: "3.2.449"
  OSS_RUFF_VERSION: "0.11.8"

jobs:
  validate:
    uses: ./.github/workflows/base-validate.yml
    secrets: inherit
    with:
      enable_real_linters: "true"
      ruff_version: "0.11.8"

  security-gates:
    needs: [validate]
    uses: ./.github/workflows/security-gates-oss.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  build:
    if: github.ref == 'refs/heads/main'
    needs: [security-gates]
    uses: ./.github/workflows/oss/build-push.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  sbom:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/jobs/sbom-oss.yml
    secrets: inherit

  sca-image:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/oss/sca-image.yml
    secrets: inherit
    with:
      image: ${{ needs.build.outputs.image }}

  sign:
    if: github.ref == 'refs/heads/main'
    needs: [build, sca-image]
    uses: ./.github/workflows/jobs/sign-oss.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  conftest:
    needs: [validate]
    uses: ./.github/workflows/jobs/oss/conftest-admission.yml
    secrets: inherit

  sbom-upload:
    if: github.ref == 'refs/heads/main'
    needs: sbom
    uses: ./.github/workflows/jobs/oss/sbom-upload.yml
    secrets: inherit

  sec-func-tests:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    uses: ./.github/workflows/jobs/sec-func-tests.yml
    secrets: inherit

  deploy-preprod:
    if: github.ref == 'refs/heads/main'
    needs: [sign, build]
    uses: ./.github/workflows/oss/helm-deploy.yml
    secrets: inherit
    with:
      environment: preprod
      namespace: preprod
      image: ${{ needs.build.outputs.image }}

  iast-preprod:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    uses: ./.github/workflows/jobs/oss/iast-preprod.yml
    secrets: inherit

# Manual preprod scans (also runnable standalone):
# DAST: templates/github/workflows/dast-oss.yml
# API fuzz: templates/github/workflows/api-fuzz-oss.yml
# Binary fuzz: templates/github/workflows/binary-fuzz-oss.yml
# IAST standalone: templates/github/workflows/iast-oss.yml
# Nightly SAST: templates/github/workflows/nightly-sast-oss.yml
