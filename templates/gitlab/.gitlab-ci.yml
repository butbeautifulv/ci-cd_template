# GitLab CI entrypoint — copy to repository root as .gitlab-ci.yml
# For 100% OSS (GitLab CE): use templates/profiles/oss-full.gitlab-ci.yml instead
# (no GitLab Security/*.gitlab-ci.yml vendor templates)
# Includes job fragments from templates/gitlab/jobs/

stages:
  - validate
  - test
  - security
  - build
  - deploy
  - post-deploy

variables:
  REGISTRY: "${CI_REGISTRY_IMAGE}"
  SECURITY_POLICY: "config/security-gate-policy.yaml"

include:
  - local: '/templates/gitlab/jobs/registry/variables.yml'
  - local: '/templates/gitlab/jobs/registry/login.yml'
  - local: '/templates/gitlab/jobs/_base.yml'
  - local: '/templates/gitlab/jobs/secret-scan.yml'
  - local: '/templates/gitlab/jobs/sast.yml'
  - local: '/templates/gitlab/jobs/osa.yml'
  - local: '/templates/gitlab/jobs/iac-scan.yml'
  - local: '/templates/gitlab/jobs/dockerfile-lint.yml'
  - local: '/templates/gitlab/jobs/linter-security.yml'
  - local: '/templates/gitlab/jobs/sbom.yml'
  - local: '/templates/gitlab/jobs/container-scan.yml'
  - local: '/templates/gitlab/jobs/sign.yml'
  - local: '/templates/gitlab/jobs/deploy-preprod.yml'
  - local: '/templates/gitlab/jobs/dast.yml'
  - local: '/templates/gitlab/jobs/sec-func-tests.yml'
  - local: '/templates/gitlab/jobs/iast-preprod.yml'
  - local: '/templates/gitlab/jobs/nightly-full-sast.yml'
  - local: '/templates/gitlab/jobs/conftest-admission.yml'

# Adjust `local:` paths if jobs live at repo root after copy:
# - local: '.gitlab/jobs/_base.yml'
