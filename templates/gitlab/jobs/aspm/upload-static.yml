# ASPM upload wave — static findings (security stage)
# Corp: PyYAML optional (aspm-export falls back to _parse_config_simple).
# Shell runners ignore job image — docker-run OSS_PYTHON_IMAGE when python3 missing.

.aspm_upload_static:
  stage: static-security-upload
  # Literal Nexus python (K8s ignores empty/unexpanded ${OSS_PYTHON_IMAGE} → alpine default).
  image: $OSS_PYTHON_IMAGE
  extends:
    - .defectdojo_skip_rules
    - .security_job_defaults
  script:
    - |
      REPORT="${ASPM_REPORT:?}"
      CONTROL="${ASPM_CONTROL:?}"
      if [ -f scripts/resolve-mirror-service.sh ] && { [ -n "${CI_COMMIT_TAG:-}" ] || [ -n "${SERVICE_NAME:-}" ]; }; then
        # shellcheck disable=SC1091
        . scripts/resolve-mirror-service.sh || true
      fi
      echo "[aspm] product=${DEFECTDOJO_PRODUCT_NAME:-unset} control=$CONTROL report=$REPORT"
      if [ ! -f "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT not found (scan failed or skipped; not an import success)"
        exit 0
      fi
      if [ ! -s "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT is empty (not an import success)"
        exit 0
      fi
      if python3 -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); raise SystemExit(0 if isinstance(d,list) and len(d)==0 else 1)" "$REPORT" 2>/dev/null
      then
        echo "[aspm] skip — artifact $REPORT contains empty list payload (not an import success)"
        exit 0
      fi
      run_aspm() {
        if command -v python3 >/dev/null 2>&1; then
          python3 scripts/aspm-export.py --control "$CONTROL" --report "$REPORT" --skip-empty
          return $?
        fi
        if command -v docker >/dev/null 2>&1 && [ -n "${OSS_PYTHON_IMAGE:-}" ]; then
          echo "[aspm] python3 missing — docker run ${OSS_PYTHON_IMAGE}"
          docker run --rm \
            -e DEFECTDOJO_URL \
            -e DEFECTDOJO_API_TOKEN \
            -e DEFECTDOJO_PRODUCT_NAME \
            -e DEFECTDOJO_ENGAGEMENT \
            -e DEFECTDOJO_FAIL_ON_ERROR \
            -e DEFECTDOJO_INSECURE \
            -e CI_PROJECT_NAME \
            -e CI_COMMIT_SHA \
            -e CI_COMMIT_REF_NAME \
            -e CI_PIPELINE_ID \
            -v "$PWD:/work" -w /work \
            "${OSS_PYTHON_IMAGE}" \
            python3 scripts/aspm-export.py --control "$CONTROL" --report "$REPORT" --skip-empty
          return $?
        fi
        echo "[aspm] ERROR: artifact present but python3/docker unavailable — refusing soft-green skip"
        return 1
      }
      run_aspm

upload-gitleaks-to-dojo:
  extends: .aspm_upload_static
  variables:
    ASPM_CONTROL: secrets
    ASPM_REPORT: gitleaks.sarif
  needs:
    - job: gitleaks-scan
      artifacts: true
      optional: true

