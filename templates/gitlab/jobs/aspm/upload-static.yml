upload-dast-to-dojo:
  stage: post-deploy
  extends: .aspm_upload_static
  variables:
    ASPM_CONTROL: dast
    ASPM_REPORT: reports/zap-api.xml
    ASPM_SKIP_EMPTY: "false"
  needs:
    - job: dast-zap
      artifacts: true
      optional: true
    - job: dast-compose
      artifacts: true
      optional: true
  script:
    - |
      REPORT="${ASPM_REPORT:?}"
      CONTROL="${ASPM_CONTROL:?}"
      if [ -f scripts/resolve-mirror-service.sh ] && { [ -n "${CI_COMMIT_TAG:-}" ] || [ -n "${SERVICE_NAME:-}" ]; }; then
        # shellcheck disable=SC1091
        . scripts/resolve-mirror-service.sh || true
      fi
      echo "[aspm] product=${DEFECTDOJO_PRODUCT_NAME:-unset} control=$CONTROL report=$REPORT"
      if [ ! -f "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT not found (scan failed or skipped; not an import success)"
        exit 0
      fi
      if [ ! -s "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT is empty (not an import success)"
        exit 0
      fi
      if command -v python3 >/dev/null 2>&1; then
        # No --skip-empty: create Dojo Test even with zero ZAP alerts. XML required for ZAP Scan.
        python3 scripts/aspm-export.py --control "$CONTROL" --report "$REPORT"
      else
        echo "[aspm] ERROR: python3 unavailable"
        exit 1
      fi

