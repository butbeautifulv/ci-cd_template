# ASPM export — per-scan upload to DefectDojo (after_script snippet).
# Scan jobs set ASPM_CONTROL + ASPM_REPORT, then:
#   after_script:
#     - sh scripts/aspm-export-ci.sh
# Or !reference this anchor when the job has no other after_script.

.aspm_export:
  after_script:
    - sh scripts/aspm-export-ci.sh
