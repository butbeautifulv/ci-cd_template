# ASPM upload wave — DEPRECATED for mirror/oss-full profiles.
# Image/SCA jobs now call scripts/aspm-export-ci.sh in after_script.
# Prefer: scripts/aspm-export-ci.sh from trivy-sca / sbom-generate after_script.

# ASPM upload wave — supply-chain findings (post-build)
# Corp: literal Nexus python; no pypi.org; product from resolve-mirror-service.

.aspm_upload_image:
  stage: image-security-upload
  image: $OSS_PYTHON_IMAGE
  extends:
    - .defectdojo_skip_rules
    - .security_job_defaults
  script:
    - |
      REPORT="${ASPM_REPORT:?}"
      CONTROL="${ASPM_CONTROL:?}"
      if [ -f scripts/resolve-mirror-service.sh ] && { [ -n "${CI_COMMIT_TAG:-}" ] || [ -n "${SERVICE_NAME:-}" ]; }; then
        # shellcheck disable=SC1091
        . scripts/resolve-mirror-service.sh || true
      fi
      echo "[aspm] product=${DEFECTDOJO_PRODUCT_NAME:-unset} control=$CONTROL report=$REPORT"
      echo "[aspm] BUILD_FALLBACK=${BUILD_FALLBACK:-unset}"
      if [ ! -f "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT not found"
        exit 0
      fi
      if [ ! -s "$REPORT" ]; then
        echo "[aspm] skip — artifact $REPORT is empty"
        exit 0
      fi
      if command -v python3 >/dev/null 2>&1; then
        python3 scripts/aspm-export.py --control "$CONTROL" --report "$REPORT" --skip-empty
      elif command -v docker >/dev/null 2>&1 && [ -n "${OSS_PYTHON_IMAGE:-}" ]; then
        docker run --rm \
          -e DEFECTDOJO_URL -e DEFECTDOJO_API_TOKEN -e DEFECTDOJO_PRODUCT_NAME \
          -e DEFECTDOJO_ENGAGEMENT -e DEFECTDOJO_FAIL_ON_ERROR -e DEFECTDOJO_INSECURE \
          -e CI_PROJECT_NAME -e CI_COMMIT_SHA -e CI_COMMIT_REF_NAME -e CI_PIPELINE_ID \
          -v "$PWD:/work" -w /work \
          "${OSS_PYTHON_IMAGE}" \
          python3 scripts/aspm-export.py --control "$CONTROL" --report "$REPORT" --skip-empty
      else
        echo "[aspm] ERROR: python3/docker unavailable"
        exit 1
      fi

upload-sca-to-dojo:
  extends: .aspm_upload_image
  variables:
    ASPM_CONTROL: sca
    ASPM_REPORT: sca.sarif
  needs:
    - job: trivy-sca
      artifacts: true
      optional: true

upload-sbom-to-dojo:
  extends: .aspm_upload_image
  variables:
    ASPM_CONTROL: sbom
    ASPM_REPORT: sbom.cdx.json
  needs:
    - job: trivy-sca
      artifacts: true
      optional: true
