# Shared OSS docker runner (dind) for registry-based scanners
# Corp offline: no apk/apt unless ALLOW_ONLINE_BOOTSTRAP=1 (demos only).

.oss_docker_job:
  image: ${OSS_DOCKER_CLI_IMAGE}
  services:
    - name: ${OSS_DOCKER_DIND_IMAGE}
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - |
      if [ "${ALLOW_ONLINE_BOOTSTRAP:-}" = "1" ]; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3 git
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq python3 git && rm -rf /var/lib/apt/lists/* || true
        else
          echo "[oss_docker_job] ALLOW_ONLINE_BOOTSTRAP=1 but no apk/apt-get"
        fi
      else
        echo "[oss_docker_job] offline — skip apk/apt (set ALLOW_ONLINE_BOOTSTRAP=1 for demos)"
      fi
