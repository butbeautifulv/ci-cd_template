# Corp mirror — OWASP ZAP API scan DAST (OpenAPI-driven, full operation coverage).
# Uses Nexus-hosted ZAP image; no apt/apk.
# Fails when BUILD_FALLBACK=1 / DEPLOY_SKIPPED / API_BASE_URL unset / empty report /
# coverage regression. DefectDojo "ZAP Scan" requires XML (-x), not JSON (-J).

dast-zap:
  stage: api-security
  image:
    name: $OSS_ZAPROXY_IMAGE
    entrypoint: [""]
  timeout: 2h
  variables:
    ASPM_CONTROL: dast
    ASPM_REPORT: reports/zap-api.xml
    ASPM_SKIP_EMPTY: "false"
    KUBERNETES_MEMORY_REQUEST: "512Mi"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
  needs:
    - job: deploy-test
      artifacts: true
  script:
    - sh scripts/run-dast-zap-api-mirror.sh
  after_script:
    - sh scripts/aspm-export-ci.sh
  artifacts:
    when: always
    paths:
      - reports/zap-api.xml
      - reports/zap-api.json
      - reports/live-openapi.json
    expire_in: 30 days
  allow_failure: false
