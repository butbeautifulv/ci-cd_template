# B3 — OSA (Trivy filesystem / dependency manifests)

.trivy_install:
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - |
      TRIVY_VERSION="${OSS_TRIVY_VERSION:-0.63.0}"
      curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
        | tar xz -C /usr/local/bin trivy

trivy-osa:
  stage: security
  image: ${OSS_PYTHON_IMAGE}
  extends:
    - .workflow_rules
    - .aspm_export
    - .trivy_install
  variables:
    ASPM_CONTROL: osa
    ASPM_REPORT: osa.sarif
  script:
    - trivy fs . --scanners vuln --severity CRITICAL,HIGH --format sarif --output osa.sarif || true
    - |
      [ -f osa.sarif ] || echo '{"runs":[{"results":[]}]}' > osa.sarif
    - python scripts/gate-check.py --control osa --report osa.sarif \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  artifacts:
    paths:
      - osa.sarif
    expire_in: 30 days
