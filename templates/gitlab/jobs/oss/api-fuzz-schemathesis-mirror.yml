# Corp mirror — Schemathesis API fuzz after ephemeral deploy (Nexus image, no apt).
# Fails when no OpenAPI / API_BASE_URL / BUILD_FALLBACK / DEPLOY_SKIPPED (see run-schemathesis-mirror.sh).

api-fuzz-schemathesis:
  stage: api-security
  image:
    name: $OSS_SCHEMATHESIS_IMAGE
    entrypoint: [""]
  variables:
    SCHEMATHESIS_PHASES: "examples,coverage,fuzzing"
    ASPM_CONTROL: fuzzing
    ASPM_REPORT: reports/schemathesis-junit.xml
    ASPM_SKIP_EMPTY: "false"
    # Do not set SCHEMATHESIS_HOOKS to a file path — Schemathesis imports it as a
    # module (hyphenated tests/security/schemathesis-hooks.py → ModuleNotFoundError
    # → no junit → gate warn fake-green). run-schemathesis-mirror.sh installs hooks.
  needs:
    - job: build-image
      artifacts: true
      optional: true
    - job: deploy-test
      artifacts: true
      optional: true
    - job: trivy-sca
      optional: true
  before_script:
    - !reference [.source_checkout, before_script]
  script:
    - sh scripts/run-schemathesis-mirror.sh
  after_script:
    - sh scripts/aspm-export-ci.sh
  artifacts:
    when: always
    paths:
      - reports/schemathesis-junit.xml
    expire_in: 30 days
  allow_failure: false
