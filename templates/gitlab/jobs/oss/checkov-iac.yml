# B4 — IaC scanning (OSS Checkov)

checkov-iac:
  stage: security
  image: ${OSS_PYTHON_IMAGE}
  extends:
    - .security_job_defaults
  variables:
    ASPM_REPORT: reports/checkov-report.json
  rules:
    - if: $SAST_DISABLED == 'true' || $SAST_DISABLED == '1' || $SECURITY_DISABLED == 'true' || $SECURITY_DISABLED == '1'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.tf"
        - "**/k8s/**"
        - "**/helm/**"
        - "**/chart/**"
        - "docker-compose*.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*.tf"
        - "**/k8s/**"
        - "**/helm/**"
        - "**/chart/**"
        - "docker-compose*.yml"
  script:
    - pip install -q "checkov==${OSS_CHECKOV_VERSION:-3.2.449}"
    - mkdir -p reports
    - |
      checkov -d . --framework terraform,kubernetes,helm,dockerfile,docker_compose --soft-fail \
        --output sarif --output-file-path reports \
        --output json --output-file-path reports || true
      # checkov's output filename varies by version (results_sarif.sarif vs checkov.sarif) —
      # normalize the path, but don't fabricate a fake clean report if checkov produced
      # neither: gate-check.py treats a genuinely missing report as "tool didn't run", not "clean".
      if [ -f reports/results_sarif.sarif ]; then
        cp reports/results_sarif.sarif reports/checkov.sarif
      fi
      if [ -f reports/results_json.json ]; then
        cp reports/results_json.json reports/checkov-report.json
      fi
    - python3 scripts/gate-check.py --control iac --report reports/checkov.sarif \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
