# B4 — IaC scanning (OSS Checkov — Nexus prebuilt image, no pip)

checkov-iac:
  stage: security
  image:
    name: ${OSS_CHECKOV_IMAGE:-bridgecrew/checkov:3.2.449}
    entrypoint: [""]
  extends:
    - .security_job_defaults
  variables:
    ASPM_REPORT: reports/checkov-report.json
  rules:
    - if: $SAST_DISABLED == 'true' || $SAST_DISABLED == '1' || $SECURITY_DISABLED == 'true' || $SECURITY_DISABLED == '1'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.tf"
        - "**/k8s/**"
        - "**/helm/**"
        - "**/chart/**"
        - "docker-compose*.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*.tf"
        - "**/k8s/**"
        - "**/helm/**"
        - "**/chart/**"
        - "docker-compose*.yml"
  before_script:
    - !reference [.source_checkout, before_script]
  script:
    - mkdir -p reports
    - |
      SCAN_ROOT="${SCAN_ROOT:-checkout}"
      if [ -n "${SCAN_TARGET:-}" ] && [ -d "$SCAN_TARGET" ]; then
        :
      elif [ "${SERVICE_PATH:-.}" = "." ] || [ -z "${SERVICE_PATH:-}" ]; then
        SCAN_TARGET="$SCAN_ROOT"
      else
        SCAN_TARGET="${SCAN_ROOT}/${SERVICE_PATH}"
      fi
      if [ ! -d "$SCAN_TARGET" ] && [ -d "$SCAN_ROOT" ]; then
        echo "[iac] WARN: $SCAN_TARGET missing; using $SCAN_ROOT"
        SCAN_TARGET="$SCAN_ROOT"
      fi
      if [ ! -d "$SCAN_TARGET" ]; then
        echo "[iac] ERROR: scan target missing: $SCAN_TARGET"
        exit 1
      fi
      CHECKOV_ARGS="-d /work/${SCAN_TARGET} --framework terraform,kubernetes,helm,dockerfile --soft-fail --output sarif --output-file-path /work/reports --output json --output-file-path /work/reports"
      if command -v checkov >/dev/null 2>&1; then
        checkov -d "$SCAN_TARGET" --framework terraform,kubernetes,helm,dockerfile --soft-fail \
          --output sarif --output-file-path reports \
          --output json --output-file-path reports || true
      elif command -v docker >/dev/null 2>&1 && [ -n "${OSS_CHECKOV_IMAGE:-}" ]; then
        # Shell runners often ignore job image:; run Nexus checkov via docker (no pip).
        echo "[iac] checkov binary missing — docker run ${OSS_CHECKOV_IMAGE}"
        docker run --rm -v "$PWD:/work" -w /work --entrypoint checkov "${OSS_CHECKOV_IMAGE}" \
          -d "$SCAN_TARGET" --framework terraform,kubernetes,helm,dockerfile --soft-fail \
          --output sarif --output-file-path reports \
          --output json --output-file-path reports || true
      else
        echo "[iac] ERROR: checkov unavailable (need OSS_CHECKOV_IMAGE in job image or docker; no pip install)"
        exit 1
      fi
      if [ -f reports/results_sarif.sarif ]; then
        cp reports/results_sarif.sarif reports/checkov.sarif
      fi
      if [ -f reports/results_json.json ]; then
        cp reports/results_json.json reports/checkov-report.json
      fi
      if [ ! -f reports/checkov.sarif ] && [ ! -f reports/checkov-report.json ]; then
        echo "[iac] ERROR: checkov produced no report (refusing empty stub)"
        exit 1
      fi
      if [ ! -f reports/checkov-report.json ]; then
        echo '{"check_type":[],"results":{"failed_checks":[]}}' > reports/checkov-report.json
      fi
      if [ ! -f reports/checkov.sarif ]; then
        echo "[iac] ERROR: reports/checkov.sarif missing after checkov run"
        exit 1
      fi
      if command -v python3 >/dev/null 2>&1; then
        python3 scripts/gate-check.py --control iac --report reports/checkov.sarif --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
      elif command -v docker >/dev/null 2>&1 && [ -n "${OSS_PYTHON_IMAGE:-}" ]; then
        docker run --rm -v "$PWD:/work" -w /work "${OSS_PYTHON_IMAGE}" \
          python3 scripts/gate-check.py --control iac --report reports/checkov.sarif --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
      elif [ -s reports/checkov.sarif ] && echo "${SECURITY_POLICY:-}" | grep -q adopt; then
        echo "[iac] WARN: gate-check skipped (no python/docker); checkov.sarif produced"
      else
        echo "[iac] ERROR: python3 unavailable for gate-check"
        exit 1
      fi
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
