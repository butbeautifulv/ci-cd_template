# C1 — SBOM generation (artifact contract: sbom.cdx.json)

sbom-generate:
  stage: build
  image:
    name: anchore/syft:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - syft dir:. -o cyclonedx-json > sbom.cdx.json
    - test -s sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 90 days
