# D1 — DAST (OWASP ZAP baseline)

dast-zap:
  stage: post-deploy
  image:
    name: ${OSS_ZAPROXY_IMAGE:-ghcr.io/zaproxy/zaproxy:2.16.0}
    entrypoint: [""]
  extends: .aspm_export
  variables:
    PREPROD_URL: "https://preprod.example.com"
    ASPM_CONTROL: dast
    ASPM_REPORT: reports/zap-baseline.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  needs:
    - job: deploy-preprod
      optional: true
  script:
    - mkdir -p reports
    - zap-baseline.py -t "${PREPROD_URL}" -J reports/zap-baseline.json || true
    - python3 scripts/gate-check.py --control dast --report reports/zap-baseline.json \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  after_script:
    - command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3)
    - !reference [.aspm_export, after_script]
  artifacts:
    paths:
      - reports/zap-baseline.json
    expire_in: 30 days
  allow_failure: true
