# Forbidden files scan (fintech MR gate — warn only)

forbidden-files:
  stage: security
  image:
    name: ${OSS_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
  extends:
    - .workflow_rules_security
    - .security_job_defaults
  variables:
    ASPM_CONTROL: linters
    ASPM_REPORT: forbidden-files.sarif
  before_script:
    - !reference [.source_checkout, before_script]
  script:
    - |
      SCAN_ROOT="${SCAN_ROOT:-checkout}"
      if [ -n "${SCAN_TARGET:-}" ] && [ -d "$SCAN_TARGET" ]; then
        :
      elif [ "${SERVICE_PATH:-.}" = "." ] || [ -z "${SERVICE_PATH:-}" ]; then
        SCAN_TARGET="$SCAN_ROOT"
      else
        SCAN_TARGET="${SCAN_ROOT}/${SERVICE_PATH}"
      fi
      if [ ! -d "$SCAN_TARGET" ] && [ -d "$SCAN_ROOT" ]; then
        echo "[scan] WARN: $SCAN_TARGET missing; using $SCAN_ROOT"
        SCAN_TARGET="$SCAN_ROOT"
      fi
      if [ ! -d "$SCAN_TARGET" ]; then
        echo "[forbidden] ERROR: scan target missing: $SCAN_TARGET"
        exit 1
      fi
      if ! command -v python3 >/dev/null 2>&1; then
        echo "[forbidden] ERROR: python3 unavailable on runner (check OSS_PYTHON_IMAGE)"
        exit 1
      fi
      echo '{"runs":[{"results":[]}]}' > forbidden-files.sarif
      FOUND=0
      PATTERNS='\.env$|\.pem$|\.key$|id_rsa|\.p12$|\.pfx$'
      while IFS= read -r f; do
        echo "WARN: suspicious file $f"
        FOUND=1
      done < <(find "$SCAN_TARGET" -type f -regextype posix-extended -regex ".*(${PATTERNS})" \
        ! -path '*/.git/*' 2>/dev/null || true)
      while IFS= read -r f; do
        if command -v file >/dev/null 2>&1; then
          file "$f" | grep -qiE 'executable|ELF|Mach-O' && {
            echo "WARN: binary $f"; FOUND=1;
          }
        fi
      done < <(find "$SCAN_TARGET" -type f ! -path '*/.git/*' 2>/dev/null | head -500)
      if [ "$FOUND" -eq 1 ]; then
        echo '{"runs":[{"results":[{"level":"medium","message":{"text":"forbidden or suspicious files detected"}}]}]}' > forbidden-files.sarif
      fi
      python3 scripts/normalize-sarif.py forbidden-files.sarif forbidden-files
    - python3 scripts/gate-check.py --control forbidden_files --report forbidden-files.sarif --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  after_script:
    - sh scripts/aspm-export-ci.sh
  artifacts:
    paths:
      - forbidden-files.sarif
    expire_in: 30 days
