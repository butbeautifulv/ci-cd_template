# ML3 — Model adversarial scan (manual, warn)

ml-model-scan:
  stage: post-deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - |
      echo "WARNING: ml-model-scan is a placeholder — no adversarial/model-format scanner (e.g. ART, Alibi Detect, modelscan) is wired up yet. This job does not actually scan model artifacts."
      echo '{"runs":[{"results":[]}]}' > ml-model.sarif
    - python scripts/gate-check.py --control ml_model --report ml-model.sarif \
        --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
  artifacts:
    paths:
      - ml-model.sarif
    expire_in: 30 days
  allow_failure: true
