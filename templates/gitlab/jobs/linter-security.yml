# B6 — Security linters (Nexus pip only — no pypi.org fallback)
# Shell runners ignore job image: — docker-run OSS_PYTHON_IMAGE when host lacks pip/ruff.

linter-security:
  stage: security
  image:
    name: ${OSS_PYTHON_IMAGE:-python:3.11.11-slim-bookworm}
  extends:
    - .workflow_rules_security
    - .security_job_defaults
  variables:
    ENABLE_REAL_LINTERS: "${ENABLE_REAL_LINTERS:-false}"
    ASPM_CONTROL: linters
    ASPM_REPORT: linter.sarif
  before_script:
    - !reference [.source_checkout, before_script]
  script:
    - |
      SCAN_ROOT="${SCAN_ROOT:-checkout}"
      if [ -n "${SCAN_TARGET:-}" ] && [ -d "$SCAN_TARGET" ]; then
        :
      elif [ "${SERVICE_PATH:-.}" = "." ] || [ -z "${SERVICE_PATH:-}" ]; then
        SCAN_TARGET="$SCAN_ROOT"
      else
        SCAN_TARGET="${SCAN_ROOT}/${SERVICE_PATH}"
      fi
      if [ ! -d "$SCAN_TARGET" ] && [ -d "$SCAN_ROOT" ]; then
        echo "[linters] WARN: $SCAN_TARGET missing; using $SCAN_ROOT"
        SCAN_TARGET="$SCAN_ROOT"
      fi
      if [ ! -d "$SCAN_TARGET" ]; then
        echo "[linters] ERROR: scan target missing: $SCAN_TARGET"
        exit 1
      fi
      if [ "$ENABLE_REAL_LINTERS" != "true" ]; then
        echo "Linter gate stub — set ENABLE_REAL_LINTERS=true"
        echo '{"runs":[{"results":[]}]}' > linter.sarif
        exit 0
      fi
      if [ -z "${PIP_INDEX_URL:-}" ]; then
        echo "[linters] ERROR: PIP_INDEX_URL unset — corp requires Nexus PyPI (no pypi.org fallback)"
        exit 1
      fi
      # Corp Nexus PyPI is auth-gated (401 → pip "versions: none" without creds).
      PIP_INDEX_AUTH=$(sh scripts/pip-index-auth.sh)
      echo "[linters] pip_index_host=$(printf '%s' "$PIP_INDEX_AUTH" | sed -E 's#https://[^@]+@#https://***@#')"
      RUFF_PIN="ruff==${OSS_RUFF_VERSION:-0.11.8}"
      TRUSTED="${PIP_TRUSTED_HOST:-nexus.svo.aero}"
      # Avoid root-owned .ruff_cache on shared shell runners (breaks later git checkout).
      export RUFF_CACHE_DIR="${RUFF_CACHE_DIR:-/tmp/ruff-cache-${CI_JOB_ID:-$$}}"
      mkdir -p "$RUFF_CACHE_DIR"

      run_ruff_host() {
        if command -v ruff >/dev/null 2>&1; then
          ruff check "$SCAN_TARGET" --output-format sarif -o linter.sarif || true
          return 0
        fi
        if ! command -v python3 >/dev/null 2>&1; then
          return 1
        fi
        python3 -m ensurepip --upgrade >/dev/null 2>&1 || true
        if ! python3 -m pip --version >/dev/null 2>&1; then
          return 1
        fi
        if ! PIP_NO_INPUT=1 PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install -q \
          --index-url "${PIP_INDEX_AUTH}" \
          --trusted-host "${TRUSTED}" \
          "$RUFF_PIN" 2>/tmp/ruff-pip.err; then
          echo "[linters] WARN: $RUFF_PIN missing on Nexus — trying unpinned ruff"
          tail -5 /tmp/ruff-pip.err || true
          PIP_NO_INPUT=1 PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install -q \
            --index-url "${PIP_INDEX_AUTH}" \
            --trusted-host "${TRUSTED}" \
            ruff || return 1
        fi
        if command -v ruff >/dev/null 2>&1; then
          RUFF_BIN=ruff
        else
          RUFF_BIN="python3 -m ruff"
        fi
        if $RUFF_BIN check "$SCAN_TARGET" --output-format sarif -o linter.sarif 2>/tmp/ruff.err; then
          :
        else
          rc=$?
          if [ ! -f linter.sarif ]; then
            echo "[linters] WARN: ruff SARIF unsupported (rc=$rc) — synthesizing SARIF from text"
            $RUFF_BIN check "$SCAN_TARGET" > /tmp/ruff.txt 2>&1 || true
            python3 scripts/synthesize-ruff-sarif.py /tmp/ruff.txt linter.sarif
          fi
        fi
        return 0
      }

      run_ruff_docker() {
        if ! command -v docker >/dev/null 2>&1 || [ -z "${OSS_PYTHON_IMAGE:-}" ]; then
          return 1
        fi
        echo "[linters] host pip/ruff missing — docker run ${OSS_PYTHON_IMAGE}"
        # shellcheck disable=SC2086
        docker run --rm \
          -e PIP_INDEX_URL \
          -e PIP_TRUSTED_HOST \
          -e NEXUS_USER \
          -e NEXUS_PASSWORD \
          -e PIP_NO_INPUT=1 \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e OSS_RUFF_VERSION \
          -e RUFF_CACHE_DIR=/tmp/ruff-cache \
          -v "$PWD:/work" -w /work \
          "${OSS_PYTHON_IMAGE}" \
          sh -c "
            set -e
            SCAN_TARGET='$SCAN_TARGET'
            RUFF_PIN='ruff==${OSS_RUFF_VERSION:-0.11.8}'
            TRUSTED='${TRUSTED}'
            INDEX=\$(sh scripts/pip-index-auth.sh)
            mkdir -p /tmp/ruff-cache
            if ! pip install -q --index-url \"\$INDEX\" --trusted-host \"\$TRUSTED\" \"\$RUFF_PIN\"; then
              echo '[linters] WARN: pinned ruff missing — trying unpinned'
              pip install -q --index-url \"\$INDEX\" --trusted-host \"\$TRUSTED\" ruff
            fi
            if ruff check \"\$SCAN_TARGET\" --output-format sarif -o linter.sarif; then
              :
            else
              if [ ! -f linter.sarif ]; then
                echo '[linters] WARN: synthesizing SARIF from ruff text'
                ruff check \"\$SCAN_TARGET\" > /tmp/ruff.txt 2>&1 || true
                python3 scripts/synthesize-ruff-sarif.py /tmp/ruff.txt linter.sarif
              fi
            fi
            rm -rf /work/.ruff_cache
          "
      }

      if ! run_ruff_host; then
        if ! run_ruff_docker; then
          echo "[linters] ERROR: pip/ruff unavailable on host and docker/OSS_PYTHON_IMAGE path failed"
          exit 1
        fi
      fi
      if [ ! -f linter.sarif ]; then
        echo "[linters] ERROR: linter.sarif was not produced"
        exit 1
      fi
      if command -v python3 >/dev/null 2>&1; then
        python3 scripts/gate-check.py --control linters --report linter.sarif --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
      elif command -v docker >/dev/null 2>&1 && [ -n "${OSS_PYTHON_IMAGE:-}" ]; then
        docker run --rm -v "$PWD:/work" -w /work "${OSS_PYTHON_IMAGE}" \
          python3 scripts/gate-check.py --control linters --report linter.sarif --policy "${SECURITY_POLICY:-config/security-gate-policy.yaml}"
      elif echo "${SECURITY_POLICY:-}" | grep -q adopt; then
        echo "[linters] WARN: gate-check skipped (no python/docker); linter.sarif produced"
      else
        echo "[linters] ERROR: python3 unavailable for gate-check"
        exit 1
      fi
  after_script:
    - sh scripts/aspm-export-ci.sh
  artifacts:
    reports:
      codequality: linter.sarif
    paths:
      - linter.sarif
    expire_in: 30 days
