<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="640" viewBox="0 0 1016 640">
  <style>
    .title { font-family: DejaVu Sans, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #0f172a; }
    .subtitle { font-family: DejaVu Sans, Arial, sans-serif; font-size: 12px; fill: #475569; }
    .label { font-family: DejaVu Sans, Arial, sans-serif; font-size: 12px; fill: #0f172a; }
    .edge { font-family: DejaVu Sans, Arial, sans-serif; font-size: 11px; fill: #1e293b; }
    .edge-bg { fill: #ffffff; fill-opacity: 0.92; stroke: #e2e8f0; stroke-width: 1; }
    .boundary { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; }
    .boundary-label { font-family: DejaVu Sans, Arial, sans-serif; font-size: 12px; fill: #334155; font-weight: 600; }
    .node-rect { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.4; }
    .node-ellipse { fill: #E8F5E8; stroke: #2E7D32; stroke-width: 1.4; }
    .node-cyl { fill: #EFEBE9; stroke: #5D4037; stroke-width: 1.4; }
    .arrow { stroke: #334155; stroke-width: 1.35; fill: none; marker-end: url(#arrowhead); }
    .note { fill: #fffbeb; stroke: #d97706; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>
  <text class="title" x="368" y="32">Data Flow Diagram (DFD v3)</text>
  <text class="subtitle" x="288" y="52">Trust boundaries, typed data flows — FastAPI · open index.html for interactive view</text>
  <rect class="boundary" x="332.0" y="60.0" width="276.0" height="476.0" rx="10"/>
  <text class="boundary-label" x="342.0" y="78.0">Application Trust Boundary</text>
  <rect class="boundary" x="692.0" y="122.0" width="276.0" height="291.2" rx="10"/>
  <text class="boundary-label" x="702.0" y="140.0">External Services</text>
  <rect class="node-rect" x="48.0" y="220.0" width="220.0" height="78.0" rx="6"/>
  <text class="label" x="158.0" y="244.0" text-anchor="middle">Пользователь</text>
  <text class="label" x="158.0" y="258.0" text-anchor="middle">STRIDE: S, R</text>
  <ellipse class="node-ellipse" cx="470.0" cy="127.0" rx="110.0" ry="39.0"/>
  <text class="label" x="470.0" y="112.0" text-anchor="middle">FastAPI / OAuth2 / JWT</text>
  <text class="label" x="470.0" y="126.0" text-anchor="middle">(аутентификация)</text>
  <text class="label" x="470.0" y="140.0" text-anchor="middle">STRIDE: S, T, R, I, D, E</text>
  <ellipse class="node-ellipse" cx="470.0" cy="241.0" rx="110.0" ry="39.0"/>
  <text class="label" x="470.0" y="226.0" text-anchor="middle">Pydantic validation</text>
  <text class="label" x="470.0" y="240.0" text-anchor="middle">+ business logic</text>
  <text class="label" x="470.0" y="254.0" text-anchor="middle">STRIDE: S, T, R, I, D, E</text>
  <ellipse class="node-ellipse" cx="470.0" cy="355.0" rx="110.0" ry="39.0"/>
  <text class="label" x="470.0" y="340.0" text-anchor="middle">Работа с файлами</text>
  <text class="label" x="470.0" y="354.0" text-anchor="middle">STRIDE: S, T, R, I, D, E</text>
  <ellipse class="node-cyl" cx="470.0" cy="441.0" rx="104.0" ry="11"/>
  <rect class="node-cyl" x="366.0" y="441.0" width="208.0" height="56.0"/>
  <ellipse class="node-cyl" cx="470.0" cy="497.0" rx="104.0" ry="11"/>
  <text class="label" x="470.0" y="454.0" text-anchor="middle">Конфигурация</text>
  <text class="label" x="470.0" y="468.0" text-anchor="middle">(pydantic-settings)</text>
  <text class="label" x="470.0" y="482.0" text-anchor="middle">STRIDE: T, I, D</text>
  <rect class="node-rect" x="720.0" y="150.0" width="220.0" height="78.0" rx="6"/>
  <text class="label" x="830.0" y="174.0" text-anchor="middle">Внешнее API</text>
  <text class="label" x="830.0" y="188.0" text-anchor="middle">STRIDE: S, R</text>
  <ellipse class="node-cyl" cx="830.0" cy="318.2" rx="104.0" ry="11"/>
  <rect class="node-cyl" x="726.0" y="318.2" width="208.0" height="56.0"/>
  <ellipse class="node-cyl" cx="830.0" cy="374.2" rx="104.0" ry="11"/>
  <text class="label" x="830.0" y="331.2" text-anchor="middle">Файловое хранилище</text>
  <text class="label" x="830.0" y="345.2" text-anchor="middle">(S3 SSE)</text>
  <text class="label" x="830.0" y="359.2" text-anchor="middle">STRIDE: T, I, D</text>
  <path class="arrow" d="M 268.0 259.0 Q 314.0 175.0 360.0 127.0"/>
  <rect class="edge-bg" x="185.1" y="157.0" width="257.8" height="38.0" rx="4"/>
  <text class="edge" x="314.0" y="169.0" text-anchor="middle">учетные данные (PII)</text>
  <text class="edge" x="314.0" y="183.0" text-anchor="middle">LINDDUN: L, D (Linkability, Disclosure)</text>
  <path class="arrow" d="M 470.0 430.0 Q 470.0 320.0 470.0 166.0"/>
  <rect class="edge-bg" x="279.1" y="302.0" width="381.8" height="24.0" rx="4"/>
  <text class="edge" x="470.0" y="314.0" text-anchor="middle">настройки аутентификации (read-only)</text>
  <path class="arrow" d="M 470.0 166.0 Q 470.0 172.0 470.0 202.0"/>
  <rect class="edge-bg" x="390.7" y="154.0" width="158.6" height="24.0" rx="4"/>
  <text class="edge" x="470.0" y="166.0" text-anchor="middle">токен (JWT/OAuth2)</text>
  <path class="arrow" d="M 470.0 280.0 Q 470.0 312.0 470.0 316.0"/>
  <rect class="edge-bg" x="341.1" y="294.0" width="257.8" height="24.0" rx="4"/>
  <text class="edge" x="470.0" y="306.0" text-anchor="middle">данные для записи (JSON)</text>
  <path class="arrow" d="M 580.0 355.0 Q 650.0 334.6 720.0 346.2"/>
  <rect class="edge-bg" x="573.8" y="316.6" width="152.4" height="24.0" rx="4"/>
  <text class="edge" x="650.0" y="328.6" text-anchor="middle">S3 API / HTTPS/TLS 1.3</text>
  <path class="arrow" d="M 580.0 241.0 Q 650.0 233.0 720.0 189.0"/>
  <rect class="edge-bg" x="518.0" y="215.0" width="264.0" height="24.0" rx="4"/>
  <text class="edge" x="650.0" y="227.0" text-anchor="middle">API запросы; HTTPS/TLS 1.3 (JSON)</text>
  <path class="arrow" d="M 720.0 189.0 Q 650.0 195.0 580.0 241.0"/>
  <rect class="edge-bg" x="524.2" y="177.0" width="251.6" height="24.0" rx="4"/>
  <text class="edge" x="650.0" y="189.0" text-anchor="middle">API ответы; HTTPS/TLS 1.3 (JSON)</text>
  <rect class="note" x="48.0" y="520.0" width="420" height="100" rx="6"/>
  <text class="label" x="60.0" y="542.0" text-anchor="start">Нотация:</text>
  <text class="label" x="60.0" y="556.0" text-anchor="start">- STRIDE on nodes</text>
  <text class="label" x="60.0" y="570.0" text-anchor="start">- LINDDUN on PII flow</text>
  <text class="label" x="60.0" y="584.0" text-anchor="start">- Misuse: weak OAuth, credential stuffing</text>
  <text class="label" x="60.0" y="598.0" text-anchor="start">- Abuse: token replay, SSRF via outbound API</text>
</svg>
